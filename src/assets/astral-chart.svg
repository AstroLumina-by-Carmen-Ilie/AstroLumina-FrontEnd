<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions for gradients and filters -->
    <defs>
        <radialGradient id="bgGradient">
            <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
        </radialGradient>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background is transparent -->
    
    <!-- Outer decorative ring -->
    <circle cx="200" cy="200" r="195" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.8"/>
    <circle cx="200" cy="200" r="190" fill="none" stroke="#2a2a3e" stroke-width="1"/>
    
    <!-- Main wheel circles -->
    <circle cx="200" cy="200" r="180" fill="none" stroke="#4a5568" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="160" fill="none" stroke="#4a5568" stroke-width="1"/>
    <circle cx="200" cy="200" r="140" fill="none" stroke="#4a5568" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.6"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#4a5568" stroke-width="1"/>
    <circle cx="200" cy="200" r="100" fill="none" stroke="#4a5568" stroke-width="0.5" stroke-dasharray="1,2" opacity="0.5"/>
    <circle cx="200" cy="200" r="80" fill="none" stroke="#4a5568" stroke-width="1"/>
    <circle cx="200" cy="200" r="60" fill="none" stroke="#4a5568" stroke-width="0.5" opacity="0.4"/>
    
    <!-- House divisions (12 houses - exactly 30 degrees each, counter-clockwise starting from left/9 o'clock) -->
    <g stroke="#6b7280" stroke-width="0.8" opacity="0.7">
        <!-- House 1: 180° (9 o'clock - left, Ascendant) -->
        <line x1="20" y1="200" x2="380" y2="200" stroke-width="1.2"/>
        <!-- House 2: 150° -->
        <line x1="50" y1="113.4" x2="350" y2="286.6" />
        <!-- House 3: 120° -->
        <line x1="100" y1="42.3" x2="300" y2="357.7" />
        <!-- House 4: 90° (12 o'clock - top, IC) -->
        <line x1="200" y1="20" x2="200" y2="380" stroke-width="1.2"/>
        <!-- House 5: 60° -->
        <line x1="300" y1="42.3" x2="100" y2="357.7" />
        <!-- House 6: 30° -->
        <line x1="350" y1="113.4" x2="50" y2="286.6" />
        <!-- House 7: 0° (3 o'clock - right, Descendant) -->
        <line x1="380" y1="200" x2="20" y2="200" stroke-width="1.2"/>
        <!-- House 8: 330° -->
        <line x1="350" y1="286.6" x2="50" y2="113.4" />
        <!-- House 9: 300° -->
        <line x1="300" y1="357.7" x2="100" y2="42.3" />
        <!-- House 10: 270° (6 o'clock - bottom, MC) -->
        <line x1="200" y1="380" x2="200" y2="20" stroke-width="1.2"/>
        <!-- House 11: 240° -->
        <line x1="100" y1="357.7" x2="300" y2="42.3" />
        <!-- House 12: 210° -->
        <line x1="50" y1="286.6" x2="350" y2="113.4" />
    </g>
    
    <!-- Zodiac symbols (12 signs - at the edge, centered between house numbers) -->
    <g fill="url(#goldGradient)" font-family="serif" font-size="18" text-anchor="middle" filter="url(#glow)">
        <!-- Between House 1 and House 2: Aries -->
        <text x="32" y="242" font-weight="bold">♈</text>
        <!-- Between House 2 and House 3: Taurus -->
        <text x="82" y="320" font-weight="bold">♉</text>
        <!-- Between House 3 and House 4: Gemini -->
        <text x="157" y="367" font-weight="bold">♊</text>
        <!-- Between House 4 and House 5: Cancer -->
        <text x="242" y="367" font-weight="bold">♋</text>
        <!-- Between House 5 and House 6: Leo -->
        <text x="317" y="320" font-weight="bold">♌</text>
        <!-- Between House 6 and House 7: Virgo -->
        <text x="367" y="242" font-weight="bold">♍</text>
        <!-- Between House 7 and House 8: Libra -->
        <text x="367" y="157" font-weight="bold">♎</text>
        <!-- Between House 8 and House 9: Scorpio -->
        <text x="317" y="82" font-weight="bold">♏</text>
        <!-- Between House 9 and House 10: Sagittarius -->
        <text x="242" y="32" font-weight="bold">♐</text>
        <!-- Between House 10 and House 11: Capricorn -->
        <text x="157" y="32" font-weight="bold">♑</text>
        <!-- Between House 11 and House 12: Aquarius -->
        <text x="82" y="82" font-weight="bold">♒</text>
        <!-- Between House 12 and House 1: Pisces -->
        <text x="32" y="157" font-weight="bold">♓</text>
    </g>
    
    <!-- House numbers (counter-clockwise starting from left) -->
    <g fill="#9ca3af" font-family="Arial" font-size="10" text-anchor="middle" opacity="0.8">
        <text x="15" y="200">1</text>
        <text x="50" y="285">2</text>
        <text x="115" y="350">3</text>
        <text x="200" y="385">4</text>
        <text x="285" y="350">5</text>
        <text x="350" y="285">6</text>
        <text x="385" y="200">7</text>
        <text x="350" y="115">8</text>
        <text x="285" y="50">9</text>
        <text x="200" y="15">10</text>
        <text x="115" y="50">11</text>
        <text x="50" y="115">12</text>
    </g>
    
    </svg>
