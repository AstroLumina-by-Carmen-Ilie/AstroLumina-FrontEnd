<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky-gradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0a1a3f" />
      <stop offset="100%" stop-color="#000020" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#sky-gradient)" />
  
  <!-- Stars (small dots) -->
  <g fill="#ffffff" opacity="0.8">
    <!-- Random stars -->
    <circle cx="120" cy="150" r="1.2" />
    <circle cx="250" cy="80" r="1.5" />
    <circle cx="380" cy="120" r="1" />
    <circle cx="500" cy="200" r="1.3" />
    <circle cx="650" cy="150" r="1.1" />
    <circle cx="720" cy="90" r="1.4" />
    <circle cx="180" cy="250" r="1.2" />
    <circle cx="300" cy="300" r="1" />
    <circle cx="450" cy="280" r="1.5" />
    <circle cx="580" cy="320" r="1.3" />
    <circle cx="100" cy="400" r="1.1" />
    <circle cx="220" cy="450" r="1.4" />
    <circle cx="350" cy="420" r="1.2" />
    <circle cx="480" cy="470" r="1" />
    <circle cx="600" cy="430" r="1.5" />
    <circle cx="700" cy="480" r="1.3" />
    <circle cx="150" cy="550" r="1.1" />
    <circle cx="280" cy="580" r="1.4" />
    <circle cx="400" cy="540" r="1.2" />
    <circle cx="520" cy="600" r="1" />
    <circle cx="650" cy="560" r="1.5" />
    <circle cx="750" cy="620" r="1.3" />
    <circle cx="120" cy="680" r="1.1" />
    <circle cx="240" cy="720" r="1.4" />
    <circle cx="370" cy="670" r="1.2" />
    <circle cx="490" cy="730" r="1" />
    <circle cx="620" cy="690" r="1.5" />
    <circle cx="730" cy="740" r="1.3" />
    <circle cx="180" cy="800" r="1.1" />
    <circle cx="300" cy="850" r="1.4" />
    <circle cx="420" cy="810" r="1.2" />
    <circle cx="550" cy="860" r="1" />
    <circle cx="680" cy="820" r="1.5" />
    <circle cx="750" cy="880" r="1.3" />
    <circle cx="140" cy="930" r="1.1" />
    <circle cx="260" cy="970" r="1.4" />
    <circle cx="380" cy="940" r="1.2" />
    <circle cx="510" cy="980" r="1" />
    <circle cx="640" cy="950" r="1.5" />
    <circle cx="720" cy="990" r="1.3" />
    
    <!-- Additional stars -->
    <circle cx="50" cy="50" r="1.2" />
    <circle cx="150" cy="30" r="1.0" />
    <circle cx="200" cy="70" r="1.3" />
    <circle cx="320" cy="40" r="1.1" />
    <circle cx="420" cy="60" r="1.4" />
    <circle cx="550" cy="35" r="1.2" />
    <circle cx="670" cy="55" r="1.0" />
    <circle cx="750" cy="25" r="1.3" />
    <circle cx="30" cy="180" r="1.1" />
    <circle cx="70" cy="280" r="1.4" />
    <circle cx="40" cy="350" r="1.2" />
    <circle cx="60" cy="480" r="1.0" />
    <circle cx="35" cy="580" r="1.3" />
    <circle cx="75" cy="650" r="1.1" />
    <circle cx="45" cy="750" r="1.4" />
    <circle cx="65" cy="850" r="1.2" />
    <circle cx="25" cy="950" r="1.0" />
  </g>
  
  <!-- Brighter stars -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="200" cy="120" r="2.0" />
    <circle cx="350" cy="200" r="2.2" />
    <circle cx="500" cy="150" r="2.1" />
    <circle cx="650" cy="220" r="2.3" />
    <circle cx="150" cy="350" r="2.0" />
    <circle cx="300" cy="400" r="2.2" />
    <circle cx="450" cy="380" r="2.1" />
    <circle cx="600" cy="420" r="2.3" />
    <circle cx="200" cy="550" r="2.0" />
    <circle cx="350" cy="600" r="2.2" />
    <circle cx="500" cy="580" r="2.1" />
    <circle cx="650" cy="620" r="2.3" />
    <circle cx="150" cy="750" r="2.0" />
    <circle cx="300" cy="800" r="2.2" />
    <circle cx="450" cy="780" r="2.1" />
    <circle cx="600" cy="820" r="2.3" />
    <circle cx="200" cy="950" r="2.0" />
    
    <!-- Additional brighter stars -->
    <circle cx="100" cy="100" r="2.2" />
    <circle cx="400" cy="50" r="2.3" />
    <circle cx="700" cy="120" r="2.1" />
    <circle cx="50" cy="450" r="2.0" />
    <circle cx="720" cy="520" r="2.2" />
    <circle cx="80" cy="780" r="2.3" />
    <circle cx="750" cy="850" r="2.1" />
  </g>
  
  <!-- Constellation: Ursa Major (Big Dipper) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="150" y1="150" x2="180" y2="170" />
    <line x1="180" y1="170" x2="210" y2="175" />
    <line x1="210" y1="175" x2="240" y2="160" />
    <line x1="240" y1="160" x2="270" y2="180" />
    <line x1="270" y1="180" x2="300" y2="200" />
    <line x1="300" y1="200" x2="320" y2="230" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="150" cy="150" r="2.5" />
    <circle cx="180" cy="170" r="2.2" />
    <circle cx="210" cy="175" r="2.3" />
    <circle cx="240" cy="160" r="2.4" />
    <circle cx="270" cy="180" r="2.3" />
    <circle cx="300" cy="200" r="2.2" />
    <circle cx="320" cy="230" r="2.5" />
  </g>
  
  <!-- Constellation: Orion -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="500" y1="350" x2="530" y2="380" />
    <line x1="530" y1="380" x2="560" y2="410" />
    <line x1="560" y1="410" x2="540" y2="440" />
    <line x1="540" y1="440" x2="520" y2="470" />
    <line x1="560" y1="410" x2="590" y2="420" />
    <line x1="560" y1="410" x2="530" y2="420" />
    <line x1="500" y1="350" x2="470" y2="330" />
    <line x1="470" y1="330" x2="450" y2="300" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="500" cy="350" r="3.0" /> <!-- Betelgeuse -->
    <circle cx="530" cy="380" r="2.2" />
    <circle cx="560" cy="410" r="2.3" />
    <circle cx="540" cy="440" r="2.2" />
    <circle cx="520" cy="470" r="3.0" /> <!-- Rigel -->
    <circle cx="590" cy="420" r="2.2" />
    <circle cx="530" cy="420" r="2.2" />
    <circle cx="470" cy="330" r="2.2" />
    <circle cx="450" cy="300" r="2.2" />
  </g>
  
  <!-- Constellation: Cassiopeia (W shape) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="650" y1="550" x2="680" y2="520" />
    <line x1="680" y1="520" x2="710" y2="550" />
    <line x1="710" y1="550" x2="740" y2="520" />
    <line x1="740" y1="520" x2="770" y2="550" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="650" cy="550" r="2.5" />
    <circle cx="680" cy="520" r="2.3" />
    <circle cx="710" cy="550" r="2.4" />
    <circle cx="740" cy="520" r="2.3" />
    <circle cx="770" cy="550" r="2.5" />
  </g>
  
  <!-- Constellation: Southern Cross -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="200" y1="650" x2="200" y2="700" />
    <line x1="200" y1="700" x2="200" y2="750" />
    <line x1="170" y1="700" x2="230" y2="700" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="200" cy="650" r="2.5" />
    <circle cx="200" cy="700" r="2.8" />
    <circle cx="200" cy="750" r="2.5" />
    <circle cx="170" cy="700" r="2.3" />
    <circle cx="230" cy="700" r="2.3" />
  </g>
  
  <!-- Constellation: Lyra -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="350" y1="800" x2="380" y2="830" />
    <line x1="380" y1="830" x2="410" y2="850" />
    <line x1="410" y1="850" x2="440" y2="830" />
    <line x1="440" y1="830" x2="410" y2="810" />
    <line x1="410" y1="810" x2="380" y2="830" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="350" cy="800" r="2.3" />
    <circle cx="380" cy="830" r="2.2" />
    <circle cx="410" cy="850" r="2.3" />
    <circle cx="440" cy="830" r="2.2" />
    <circle cx="410" cy="810" r="3.0" /> <!-- Vega -->
  </g>
  
  <!-- Constellation: Cygnus (Northern Cross) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.4">
    <line x1="600" y1="650" x2="600" y2="700" />
    <line x1="600" y1="700" x2="600" y2="750" />
    <line x1="600" y1="700" x2="550" y2="700" />
    <line x1="600" y1="700" x2="650" y2="700" />
    <line x1="600" y1="750" x2="580" y2="780" />
    <line x1="600" y1="750" x2="620" y2="780" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="600" cy="650" r="2.8" /> <!-- Deneb -->
    <circle cx="600" cy="700" r="2.5" />
    <circle cx="600" cy="750" r="2.3" />
    <circle cx="550" cy="700" r="2.2" />
    <circle cx="650" cy="700" r="2.2" />
    <circle cx="580" cy="780" r="2.0" />
    <circle cx="620" cy="780" r="2.0" />
  </g>
  
  <!-- Shooting star / meteor -->
  <g opacity="0.7">
    <line x1="100" y1="200" x2="200" y2="300" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" />
    </line>
    <circle cx="100" cy="200" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>
  <g opacity="0.7">
    <line x1="700" y1="400" x2="600" y2="500" stroke="#ffffff" stroke-width="1">
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite" />
    </line>
    <circle cx="700" cy="400" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
