  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e2a" />
      <stop offset="80%" stop-color="#1a2151" />
      <stop offset="100%" stop-color="#2a3166" />
    </linearGradient>
    
    <!-- Sand gradient -->
