# ==========================================================
# nginx.conf - AstroLumina Frontend
# ==========================================================

events {
    worker_connections 1024;
}

http {
    # Expose environment variables to nginx
    env ASTROLOGICAL_API_URL;
    env PAYMENT_API_URL;
    env BOOKING_API_URL;
    env STRIPE_PK;
    env NODE_ENV;
    env FRONTEND_SENTRY_DSN;
    env R2_BASE_URL;

    include       /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─── Performance ───────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # ─── Sub Filter for env.js runtime substitution ───────────────────────
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter "__ASTROLOGICAL_API_URL__" "${ASTROLOGICAL_API_URL}";
    sub_filter "__PAYMENT_API_URL__" "${PAYMENT_API_URL}";
    sub_filter "__BOOKING_API_URL__" "${BOOKING_API_URL}";
    sub_filter "__STRIPE_PK__" "${STRIPE_PK}";
    sub_filter "__NODE_ENV__" "${NODE_ENV}";
    sub_filter "__FRONTEND_SENTRY_DSN__" "${FRONTEND_SENTRY_DSN}";
    sub_filter "__R2_BASE_URL__" "${R2_BASE_URL}";

    # ==========================================================
    # Server
    # ==========================================================
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ─── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Cache Static Assets ──────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ─── No Cache HTML ────────────────────────────────────────────────
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }

        # ─── No Cache env.js (runtime config) ───────────────────────────────
        location /env.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ==========================================================
        # SPA Fallback - React Router
        # ==========================================================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Health Check ─────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}