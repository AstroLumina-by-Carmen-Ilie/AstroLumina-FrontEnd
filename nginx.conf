# nginx.conf - AstroLumina Frontend
# ==========================================================

# ─────────────────────────────────────────────────────────────────────────────
# Blocul events
# Configurează cum Nginx gestionează conexiunile la nivel de sistem.
# ─────────────────────────────────────────────────────────────────────────────
events {
    # Numărul maxim de conexiuni simultane per worker process.
    # Cu 1 worker (default pe Alpine), înseamnă 1024 conexiuni simultane total.
    # Pentru un frontend static e mai mult decât suficient.
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# Blocul http
# Configurări globale pentru tot traficul HTTP.
# ─────────────────────────────────────────────────────────────────────────────
http {
    # Încarcă maparea extensii → MIME types (ex: .js → application/javascript).
    # Fără asta, browserul nu știe cum să interpreteze fișierele descărcate.
    include       /etc/nginx/mime.types;
    # MIME type fallback pentru fișiere necunoscute.
    # octet-stream = download binar generic (browserul îl descarcă, nu îl redă).
    default_type application/octet-stream;

    # ─── Logging ───────────────────────────────────────────────────────────
    # Definește formatul "main" pentru loguri de acces.
    # Variabilele înregistrate per request:
    # $remote_addr         = IP-ul clientului
    # $remote_user         = user autentificat HTTP (de obicei "-")
    # $time_local          = timestamp local
    # $request             = ex: "GET /api/chart HTTP/1.1"
    # $status              = cod HTTP răspuns (200, 404, 500, etc.)
    # $body_bytes_sent     = dimensiunea răspunsului în bytes
    # $http_referer        = pagina de unde a venit request-ul
    # $http_user_agent     = browser/client
    # $http_x_forwarded_for = IP-ul real când e în spatele unui proxy/CDN
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    # Scrie logurile de acces în fișier folosind formatul "main" definit mai sus.
    access_log /var/log/nginx/access.log main;
    # Scrie doar erorile de nivel "warn" și mai grave (warn, error, crit, alert, emerg).
    # Nivelul "info" și "debug" sunt omise pentru a nu polua logurile în producție.
    error_log /var/log/nginx/error.log warn;

    # ─── Performance ───────────────────────────────────────────────────────
    # sendfile: transferă fișiere direct kernel→kernel fără a trece prin userspace.
    # Mult mai eficient pentru servirea fișierelor statice mari (JS bundles, imagini).
    sendfile on;
    # tcp_nopush: acumulează datele și le trimite în pachete TCP complete.
    # Reduce numărul de pachete trimise, eficient împreună cu sendfile.
    tcp_nopush on;
    # tcp_nodelay: dezactivează algoritmul Nagle pentru conexiunile keep-alive.
    # Trimite datele imediat fără să aștepte acumulare - reduce latența.
    tcp_nodelay on;
    # Cât timp păstrează o conexiune TCP keep-alive deschisă (în secunde).
    # 65s = browserul poate reutiliza conexiunea pentru mai multe request-uri
    # (HTML + JS + CSS + fonts) fără overhead de handshake TCP repetat.
    keepalive_timeout 65;
    # Numărul maxim de request-uri per conexiune keep-alive.
    # După 100 request-uri, conexiunea e închisă și recreată.
    keepalive_requests 100;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    # Activează compresia gzip pentru răspunsuri.
    # Reduce dramatic dimensiunea transferurilor: JS/CSS se comprimă cu ~70-80%.
    gzip on;
    # Adaugă header "Vary: Accept-Encoding" în răspuns.
    # Semnalează proxy-urilor și CDN-urilor că există versiuni comprimate/necomprimate,
    # prevenind servirea versiunii greșite din cache.
    gzip_vary on;
    # Comprimă și răspunsurile pentru request-uri venite prin proxy.
    # "any" = comprimă indiferent de headerele proxy.
    gzip_proxied any;
    # Nivelul de compresie: 1 (rapid, compresie slabă) → 9 (lent, compresie maximă).
    # 6 = echilibru bun între CPU usage și raport de compresie.
    gzip_comp_level 6;
    # Tipurile de conținut care vor fi comprimate.
    # Imaginile raster (jpg, png) sunt excluse - sunt deja comprimate intern.
    gzip_types text/plain text/css text/xml application/json 
               application/javascript application/rss+xml 
               application/atom+xml image/svg+xml;

    # ==========================================================
    # Server
    # Un singur virtual host care servește întreaga aplicație.
    # ==========================================================
    server {
        # Ascultă pe portul 80 (HTTP standard).
        listen 80;
        # Numele serverului - "localhost" funcționează în Docker/Render
        # unde traficul e deja proxiat prin load balancer cu SSL.
        server_name localhost;
        # Directorul rădăcină unde Nginx caută fișierele statice.
        # Corespunde cu destinația din Dockerfile: COPY --from=builder /app/dist /usr/share/nginx/html
        root /usr/share/nginx/html;
        # Fișierul servit implicit când se accesează un director (ex: /).
        index index.html;

        # ─── Security Headers ─────────────────────────────────────────────
        # X-Frame-Options: previne clickjacking - pagina nu poate fi
        # încărcată într-un <iframe> de pe alt domeniu.
        # "SAMEORIGIN" = permite iframe doar de pe același domeniu.
        add_header X-Frame-Options "SAMEORIGIN" always;
        # X-Content-Type-Options: previne MIME type sniffing.
        # Browserul respectă Content-Type exact, nu ghicește tipul fișierului.
        # Previne atacuri unde un fișier .txt e executat ca JavaScript.
        add_header X-Content-Type-Options "nosniff" always;
        # X-XSS-Protection: activează filtrul XSS din browserele mai vechi.
        # "mode=block" = blochează pagina în loc să sanitizeze (mai sigur).
        # Modern browsers folosesc CSP, dar header-ul rămâne pentru compatibilitate.
        add_header X-XSS-Protection "1; mode=block" always;
        # Referrer-Policy: controlează ce informații sunt trimise în headerul Referer.
        # "strict-origin-when-cross-origin" = trimite doar originea (nu path-ul complet)
        # la request-uri cross-origin, și nimic la downgrade HTTP→HTTPS.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Cache Static Assets ──────────────────────────────────────────
        # Regex care potrivește extensiile fișierelor statice.
        # ~* = case-insensitive regex matching.
        location ~* \.(js|css|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
            # Cache în browser timp de 1 an.
            # Funcționează sigur deoarece Vite generează nume cu hash în filename
            # (ex: index-Dh3kL9Xm.js) - la orice modificare, hash-ul se schimbă.
            expires 1y;
            # "public" = poate fi cache-uit și de proxy-uri intermediare/CDN.
            # "immutable" = browserul nu face revalidare condițională (If-Modified-Since)
            # pe durata cache-ului, eliminând request-uri inutile de rețea.
            add_header Cache-Control "public, immutable";
        }

        # ─── No Cache HTML ────────────────────────────────────────────────
        location ~* \.html$ {
            # HTML-ul NU e cache-uit deoarece conține referințele către
            # assets-urile cu hash. Dacă s-ar cache-ui, browserul ar servi
            # HTML vechi cu referințe la JS/CSS care nu mai există pe server.
            add_header Cache-Control "no-cache";
        }

        # ==========================================================
        # SPA Fallback - React Router
        # Toate cererile care nu sunt fisiere -> index.html
        # ==========================================================
        location / {
            # try_files: încearcă în ordine:
            # $uri       = caută fișierul exact (ex: /logo.png → există → îl servește)
            # $uri/      = caută ca director cu index.html
            # /index.html = fallback final → servește app-ul React
            # Fără această regulă, refresh pe /horoscop/natal ar returna 404
            # deoarece Nginx caută un fișier fizic "horoscop/natal" care nu există.
            # React Router preia controlul după ce index.html e încărcat în browser.
            try_files $uri $uri/ /index.html;
        }

        # ─── Health Check ─────────────────────────────────────────────────
        location /health {
            # Nu logăm request-urile de healthcheck - ar polua logurile
            # cu zeci de intrări pe minut de la Render/load balancer.
            access_log off;
            # Returnează imediat 200 OK cu body "OK", fără a căuta fișiere.
            # Folosit de HEALTHCHECK din Dockerfile și de Render pentru
            # a verifica dacă serviciul e funcțional.
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}