services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      - ASTROLOGICAL_API_URL=${ASTROLOGICAL_API_URL}
      - PAYMENT_API_URL=${PAYMENT_API_URL}
      - BOOKING_API_URL=${BOOKING_API_URL}
      - STRIPE_PK=${STRIPE_PK}
      - NODE_ENV=${NODE_ENV}
      - FRONTEND_SENTRY_DSN=${FRONTEND_SENTRY_DSN}
    ports:
      - "5173:80"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - frontend

networks:
  frontend:
    name: frontend-network
    driver: bridge
